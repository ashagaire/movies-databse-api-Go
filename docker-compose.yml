version: '3.8'

services:
  movies-api:
    build: .
    image: movies-api:latest
    container_name: movies-api-app
    ports:
      - "8080:8080"
    volumes:
      # Mounting a local folder for persistence
      - ./data:/app/data
    environment:
      - PORT=8080
      - DB_PATH=/app/data/movies.db